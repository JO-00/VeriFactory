services:
  postgres:
    image: postgres:17-alpine
    container_name: verifactory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: verifactory
      POSTGRES_USER: verifactory
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifactory -d verifactory"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
