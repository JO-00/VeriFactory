services:
  anvil:
    command:
      - --host
      - 0.0.0.0
      - --chain-id
      - "31337"
      - --accounts
      - "500"

  actor-init:
    build:
      context: .
      dockerfile: simulation/Dockerfile
    working_dir: /workspace
    command: ["python", "simulation/actors.py", "init"]
    environment:
      RPC_URL: http://anvil:8545
      SIM_CONFIG: /workspace/simulation_config.yaml
      ACTOR_DATA: /actor-data
      RANDOM_SEED: "42"
    volumes:
      - .:/workspace
      - actor_data:/actor-data
    depends_on:
      anvil:
        condition: service_healthy
    restart: "no"

  facility-owner:
    build:
      context: .
      dockerfile: simulation/Dockerfile
    working_dir: /workspace
    command: ["python", "simulation/actors.py", "run", "facility_owner"]
    environment:
      ACTOR_DATA: /actor-data
      ACTOR_INTERVAL: "90"
    volumes:
      - .:/workspace
      - actor_data:/actor-data
    depends_on:
      actor-init:
        condition: service_completed_successfully
    restart: unless-stopped

  relayer:
    build:
      context: .
      dockerfile: simulation/Dockerfile
    working_dir: /workspace
    command: ["python", "simulation/actors.py", "run", "relayer"]
    environment:
      ACTOR_DATA: /actor-data
      ACTOR_INTERVAL: "60"
    volumes:
      - .:/workspace
      - actor_data:/actor-data
    depends_on:
      actor-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: simulation/Dockerfile
    working_dir: /workspace
    command: ["python", "simulation/actors.py", "run", "gateway"]
    environment:
      ACTOR_DATA: /actor-data
      IPFS_API: http://ipfs:5001/api/v0/add
      ACTOR_INTERVAL: "30"
    volumes:
      - .:/workspace
      - actor_data:/actor-data
    depends_on:
      actor-init:
        condition: service_completed_successfully
      ipfs:
        condition: service_started
    restart: unless-stopped

  inspector:
    build:
      context: .
      dockerfile: simulation/Dockerfile
    working_dir: /workspace
    command: ["python", "simulation/actors.py", "run", "inspector"]
    environment:
      ACTOR_DATA: /actor-data
      IPFS_API: http://ipfs:5001/api/v0/add
      ACTOR_INTERVAL: "120"
    volumes:
      - .:/workspace
      - actor_data:/actor-data
    depends_on:
      actor-init:
        condition: service_completed_successfully
      ipfs:
        condition: service_started
    restart: unless-stopped

volumes:
  actor_data:
