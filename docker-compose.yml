services:
  postgres:
    image: postgres:17-alpine
    container_name: verifactory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifactory_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

  indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verifactory_indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable
    command: ["/usr/local/bin/indexer"]

  frontend:
    build:
      context: ./vite_frontend   # Change to your actual frontend folder name
      dockerfile: Dockerfile
    container_name: verifactory_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"         # Match your frontend port (e.g., 3000, 5173, or 80)

volumes:
  postgres_data: